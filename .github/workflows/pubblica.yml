name: Pubblica BeamBoard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il sito dallo zip
        run: |
          ZIP=$(ls beamboard-*.zip | sort -V | tail -n 1)
          unzip -q "$ZIP" -d estratto
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: estratto/beamboard
      - id: deployment
        uses: actions/deploy-pages@v4
